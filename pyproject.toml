[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalworld-research"
version = "0.9.0rc1"
description = "Research code for causally editable latent physics from passive observations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CausalWorld Contributors"}]
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "requests>=2.31",
  "huggingface-hub>=0.24",
  "tqdm>=4.66",
  "tabulate>=0.9"
]

[project.optional-dependencies]
video = ["opencv-contrib-python>=4.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["causalworld*"]

[tool.ruff]
line-length = 100
